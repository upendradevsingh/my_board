<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NL → Dashboard Agent — Interactive Prototype</title>
  <style>
    :root { --bg:#f4f1ea; --ink:#1c1c1a; --muted:#6b6a64; --paper:#fffdf8; --line:#ddd8cc; --sage:#5c7a62; --sage-d:#3f5644; --char:#2a2a28; --warn:#8a3b2a; --ok:#2f6b45; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: ui-sans-serif, system-ui, sans-serif; background:var(--bg); color:var(--ink); line-height:1.45; }
    header { background:var(--char); color:#f4f1ea; padding:18px 24px; display:flex; justify-content:space-between; align-items:baseline; gap:16px; }
    header h1 { font-size:16px; font-weight:600; margin:0; }
    header span { font-size:12px; opacity:.7; }
    main { max-width:1100px; margin:0 auto; padding:20px; }
    .row { display:grid; grid-template-columns:1fr 280px; gap:16px; }
    @media (max-width:800px){ .row{grid-template-columns:1fr;} }
    .card { background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:16px; }
    label { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); display:block; margin-bottom:6px; }
    select, textarea, button { font:inherit; width:100%; }
    select { padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:#fff; }
    textarea { min-height:72px; padding:10px; border:1px solid var(--line); border-radius:6px; resize:vertical; }
    .actions { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
    button { width:auto; padding:8px 14px; border:0; border-radius:6px; cursor:pointer; background:var(--sage); color:#fff; font-weight:560; }
    button.ghost { background:transparent; color:var(--sage-d); border:1px solid var(--line); }
    .chips { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 0; }
    .chip { font-size:12px; padding:4px 8px; border-radius:999px; border:1px solid var(--line); background:#fff; cursor:pointer; color:var(--ink); }
    .widgets { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px; margin-top:16px; }
    .widget { background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:14px; }
    .widget h3 { margin:0 0 8px; font-size:13px; }
    .badge { font-size:10px; text-transform:uppercase; letter-spacing:.06em; padding:2px 6px; border-radius:4px; display:inline-block; margin-left:6px; }
    .fresh { background:#e4f0e6; color:var(--ok); }
    .cached { background:#efe8d8; color:#6a5420; }
    .denied { background:#f3e0db; color:var(--warn); }
    .kpi { font-size:36px; font-weight:650; letter-spacing:-0.03em; }
    .kpi small { display:block; font-size:12px; color:var(--muted); font-weight:400; }
    svg.chart { width:100%; height:90px; }
    .log { font-family:ui-monospace,monospace; font-size:11px; white-space:pre-wrap; color:var(--muted); max-height:280px; overflow:auto; }
    .side h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 8px; }
    .art { font-size:12px; border-top:1px solid var(--line); padding:8px 0; }
    .err { color:var(--warn); font-size:13px; }
    footer { font-size:12px; color:var(--muted); padding:8px 24px 24px; max-width:1100px; margin:0 auto; }
  </style>
</head>
<body>
  <header>
    <h1>NL → Dashboard Agent</h1>
    <span>Interactive prototype · MCP cache + artifacts + ACL</span>
  </header>
  <main>
    <div class="row">
      <section class="card">
        <label>Acting as</label>
        <select id="user">
          <option value="alice">Alice — analyst (meetings: allow)</option>
          <option value="bob">Bob — analyst (meetings: allow)</option>
          <option value="carol">Carol — viewer (meetings: deny)</option>
        </select>
        <label style="margin-top:12px">Ask</label>
        <textarea id="q">How many meetings happened yesterday, the trend for last 30 days, and month to date</textarea>
        <div class="chips">
          <button class="chip" type="button" data-q="How many meetings happened yesterday">Yesterday</button>
          <button class="chip" type="button" data-q="Show the meeting trend for the last 30 days">30-day trend</button>
          <button class="chip" type="button" data-q="Meetings month to date">Month to date</button>
          <button class="chip" type="button" data-q="How many meetings happened yesterday, the trend for last 30 days, and month to date">All three</button>
        </div>
        <div class="actions">
          <button id="ask">Ask agent</button>
          <button class="ghost" id="clear">Clear board</button>
        </div>
        <div id="board" class="widgets"></div>
      </section>
      <aside>
        <div class="card" style="margin-bottom:12px">
          <h2 class="side">Pinned artifacts</h2>
          <div id="arts">None yet. Pin a widget after asking.</div>
        </div>
        <div class="card">
          <h2 class="side">MCP log</h2>
          <div id="log" class="log">Ready.</div>
        </div>
      </aside>
    </div>
  </main>
  <footer>Agent → MCP (ACL + cache keyed by sql fingerprint + role) → chart spec → render. Pin then share. Carol cannot read meetings.</footer>
  <script>
    const USERS = { alice:{name:"alice",role:"analyst"}, bob:{name:"bob",role:"analyst"}, carol:{name:"carol",role:"viewer"} };
    const ACL = { analyst: new Set(["meetings"]), viewer: new Set() };
    const SQL = {
      yesterday: { label:"Meetings yesterday", table:"meetings", type:"point", sql:"SELECT COUNT(*) AS count FROM meetings WHERE date = CURRENT_DATE - 1" },
      trend: { label:"Meetings — last 30 days", table:"meetings", type:"trend", sql:"SELECT date, COUNT(*) AS count FROM meetings WHERE date >= CURRENT_DATE - 30 GROUP BY date ORDER BY date" },
      mtd: { label:"Meetings month to date", table:"meetings", type:"aggregate", sql:"SELECT COUNT(*) AS count FROM meetings WHERE date >= DATE_TRUNC('month', CURRENT_DATE)" }
    };
    const WAREHOUSE = { yesterday:{count:42}, trend:{series:[28,30,29,33,31,35,34,36,38,37,39,40,41,38,42,40,43,41,39,44,42,45,43,41,46,44,42,47,45,42]}, mtd:{count:310} };
    const cache = new Map(); const artifacts = new Map(); let lastWidgets = []; let logLines = [];
    function fp(sql){ let h=0; for(let i=0;i<sql.length;i++) h=((h<<5)-h+sql.charCodeAt(i))|0; return "f"+Math.abs(h).toString(16).padStart(8,"0"); }
    function log(msg){ logLines.unshift("["+new Date().toLocaleTimeString()+"] "+msg); document.getElementById("log").textContent=logLines.slice(0,18).join("\n"); }
    function parseIntents(text){
      const t=text.toLowerCase(); const out=[];
      const wantsAll=t.includes("yesterday")&&(t.includes("30")||t.includes("trend"))&&(t.includes("month")||t.includes("mtd"));
      if(wantsAll||t.includes("yesterday")) out.push("yesterday");
      if(wantsAll||t.includes("30")||t.includes("trend")) out.push("trend");
      if(wantsAll||t.includes("month")||t.includes("mtd")) out.push("mtd");
      if(!out.length&&t.includes("meeting")) out.push("yesterday");
      return [...new Set(out)];
    }
    function mcpQuery(intentKey,user){
      const intent=SQL[intentKey];
      if(!ACL[user.role].has(intent.table)){ log("DENY "+user.name+" table="+intent.table); return {status:"permission_denied",table:intent.table}; }
      const key=fp(intent.sql)+":"+user.role;
      if(cache.has(key)){ log("CACHE HIT "+key+" user="+user.name); return {status:"cache",fingerprint:fp(intent.sql),data:cache.get(key)}; }
      cache.set(key,WAREHOUSE[intentKey]); log("WAREHOUSE "+key+" user="+user.name);
      return {status:"fresh",fingerprint:fp(intent.sql),data:WAREHOUSE[intentKey]};
    }
    function chartSpec(intentKey,data){
      if(intentKey==="yesterday") return {chart_type:"kpi_card",value:data.count,unit:"meetings"};
      if(intentKey==="trend") return {chart_type:"line",series:data.series,x:"day",y:"meetings"};
      if(intentKey==="mtd") return {chart_type:"bar",value:data.count,category:"MTD"};
      return {chart_type:"table",data};
    }
    function spark(series){
      const w=220,h=80,p=4,min=Math.min(...series),max=Math.max(...series);
      const pts=series.map((v,i)=>{ const x=p+(i/(series.length-1))*(w-2*p); const y=h-p-((v-min)/(max-min||1))*(h-2*p); return x.toFixed(1)+","+y.toFixed(1); }).join(" ");
      return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline fill="none" stroke="#5c7a62" stroke-width="2" points="${pts}" /></svg>`;
    }
    function bar(value){
      const pct=Math.min(100,Math.round(value/5));
      return `<div style="height:14px;background:#eee;border-radius:7px;overflow:hidden;margin:18px 0 8px"><div style="width:${pct}%;height:100%;background:#5c7a62"></div></div><div class="kpi">${value}<small>month to date</small></div>`;
    }
    function renderWidget(w){
      const el=document.createElement("div"); el.className="widget";
      if(w.error){ el.innerHTML=`<h3>${w.title}</h3><div class="err">Permission denied — ${w.user} cannot read ${w.table}</div><span class="badge denied">denied</span>`; return el; }
      const badge=w.source==="cache"?"cached":"fresh";
      let body="";
      if(w.spec.chart_type==="kpi_card") body=`<div class="kpi">${w.spec.value}<small>${w.spec.unit}</small></div>`;
      if(w.spec.chart_type==="line") body=spark(w.spec.series);
      if(w.spec.chart_type==="bar") body=bar(w.spec.value);
      el.innerHTML=`<h3>${w.title} <span class="badge ${badge}">${badge}</span></h3>${body}<div class="actions"><button data-pin="${w.widget_id}">Pin</button><button class="ghost" data-share="${w.widget_id}">Share with Bob</button></div><div style="font-size:11px;color:var(--muted);margin-top:6px">fp ${w.fingerprint} · ${w.spec.chart_type}</div>`;
      return el;
    }
    function renderArts(){
      const box=document.getElementById("arts");
      if(!artifacts.size){ box.textContent="None yet. Pin a widget after asking."; return; }
      const user=USERS[document.getElementById("user").value]; box.innerHTML="";
      artifacts.forEach(a=>{
        const allowed=a.owner===user.name||a.shared_with.includes(user.name);
        const div=document.createElement("div"); div.className="art";
        div.innerHTML=`<strong>${a.widget_id}</strong>${a.chart_type} · owner ${a.owner} · shared [${a.shared_with.join(", ")||"—"}]<div style="margin-top:4px">${allowed?`<button class="ghost" data-load="${a.widget_id}">Load as ${user.name}</button>`:`<span class="err">hidden from ${user.name}</span>`}</div>`;
        box.appendChild(div);
      });
    }
    function ask(){
      const user=USERS[document.getElementById("user").value];
      const intents=parseIntents(document.getElementById("q").value);
      log("ASK "+user.name+" intents="+intents.join(","));
      lastWidgets=intents.map(k=>{
        const intent=SQL[k]; const res=mcpQuery(k,user);
        if(res.status==="permission_denied") return {widget_id:"w_"+k,title:intent.label,error:true,table:res.table,user:user.name};
        return {widget_id:"w_"+k,title:intent.label,spec:chartSpec(k,res.data),source:res.status==="cache"?"cache":"warehouse",fingerprint:res.fingerprint,sql:intent.sql,intent:k};
      });
      const board=document.getElementById("board"); board.innerHTML=""; lastWidgets.forEach(w=>board.appendChild(renderWidget(w)));
    }
    document.getElementById("ask").onclick=ask;
    document.getElementById("clear").onclick=()=>{ document.getElementById("board").innerHTML=""; lastWidgets=[]; };
    document.getElementById("user").onchange=renderArts;
    document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{ document.getElementById("q").value=c.dataset.q; });
    document.getElementById("board").addEventListener("click",e=>{
      const pin=e.target.dataset.pin, share=e.target.dataset.share, user=USERS[document.getElementById("user").value];
      if(pin){ const w=lastWidgets.find(x=>x.widget_id===pin); if(!w||w.error) return; artifacts.set(pin,{widget_id:pin,chart_type:w.spec.chart_type,sql:w.sql,spec:w.spec,owner:user.name,shared_with:[]}); log("PIN "+pin+" by "+user.name); renderArts(); }
      if(share){ const a=artifacts.get(share); if(!a){ log("SHARE failed — pin first"); return; } if(!a.shared_with.includes("bob")) a.shared_with.push("bob"); log("SHARE "+share+" → bob"); renderArts(); }
    });
    document.getElementById("arts").addEventListener("click",e=>{
      const id=e.target.dataset.load; if(!id) return;
      const user=USERS[document.getElementById("user").value]; const a=artifacts.get(id); if(!a) return;
      if(a.owner!==user.name && !a.shared_with.includes(user.name)){ log("ARTIFACT DENY "+user.name+" "+id); return; }
      const res=mcpQuery(id.replace("w_",""), user);
      const board=document.getElementById("board");
      if(res.status==="permission_denied"){ board.innerHTML=""; board.appendChild(renderWidget({widget_id:id,title:a.widget_id,error:true,table:"meetings",user:user.name})); return; }
      lastWidgets=[{widget_id:id,title:id,spec:a.spec,source:res.status==="cache"?"cache":"warehouse",fingerprint:res.fingerprint,sql:a.sql}];
      board.innerHTML=""; lastWidgets.forEach(w=>board.appendChild(renderWidget(w)));
      log("LOAD artifact "+id+" as "+user.name);
    });
  </script>
</body>
</html>

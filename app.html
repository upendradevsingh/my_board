<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Cortex — Main dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:0 0% 100%;--fg:240 10% 3.9%;--card:0 0% 100%;--muted:240 4.8% 95.9%;--muted-fg:240 3.8% 46.1%;--pri:240 5.9% 10%;--pri-fg:0 0% 98%;--border:240 5.9% 90%;--accent:240 4.8% 95.9%;--ok:142 71% 29%;--warn:25 95% 40%;--r:.75rem}
html.dark{--bg:240 10% 3.9%;--fg:0 0% 98%;--card:240 10% 3.9%;--muted:240 3.7% 15.9%;--muted-fg:240 5% 64.9%;--pri:0 0% 98%;--pri-fg:240 5.9% 10%;--border:240 3.7% 15.9%;--accent:240 3.7% 15.9%}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:hsl(var(--bg));color:hsl(var(--fg));font-size:14px}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
#app{height:100%;display:flex;flex-direction:column;min-height:0}
.top{height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid hsl(var(--border));flex-shrink:0}
.icon{width:32px;height:32px;border:1px solid hsl(var(--border));border-radius:8px;background:hsl(var(--bg));display:grid;place-items:center}
.icon:hover{background:hsl(var(--accent))}
.title{font-weight:600;letter-spacing:-.02em}.sub{color:hsl(var(--muted-fg));font-size:12px;margin-left:6px}.spacer{flex:1}.who{font-size:12px;color:hsl(var(--muted-fg))}
.stage{flex:1;display:flex;min-height:0}.board{flex:1;overflow:auto;padding:20px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media(max-width:800px){.kpis{grid-template-columns:1fr}}
.card{border:1px solid hsl(var(--border));border-radius:var(--r);background:hsl(var(--card));padding:14px 16px}
.card h3{margin:0;font-size:12px;color:hsl(var(--muted-fg));font-weight:500;display:flex;justify-content:space-between}
.kpi{font-size:28px;font-weight:700;letter-spacing:-.03em;margin-top:4px}.delta{font-size:12px;color:hsl(var(--ok))}
.badge{font-size:10px;padding:1px 7px;border-radius:99px;border:1px solid hsl(var(--border));background:hsl(var(--muted))}
.badge.fresh{color:hsl(var(--ok))}.badge.cached{color:hsl(var(--warn))}
svg.chart{width:100%;height:140px;display:block}
.empty{border:1px dashed hsl(var(--border));border-radius:var(--r);padding:48px 20px;text-align:center;color:hsl(var(--muted-fg))}
.row-actions{display:flex;gap:8px;margin-top:10px}
.btn{border:0;border-radius:8px;padding:8px 12px;font-weight:500;background:hsl(var(--pri));color:hsl(var(--pri-fg))}
.btn-out{background:hsl(var(--bg));color:hsl(var(--fg));border:1px solid hsl(var(--border))}.btn-sm{padding:4px 8px;font-size:12px}
.fab{position:fixed;right:24px;bottom:24px;z-index:30;width:56px;height:56px;border-radius:999px;border:0;background:hsl(var(--pri));color:hsl(var(--pri-fg));box-shadow:0 8px 24px hsl(240 6% 10%/.18);display:grid;place-items:center}
.fab.hidden{display:none}
.chat{width:400px;max-width:42vw;border-left:1px solid hsl(var(--border));display:none;flex-direction:column;background:hsl(var(--bg));min-width:300px}
body.chat-open .chat{display:flex}@media(max-width:900px){body.chat-open .board{display:none}.chat{width:100%;max-width:none}}
.chat-head{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid hsl(var(--border))}
.thread{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:92%;padding:10px 12px;border-radius:12px;line-height:1.45}
.msg.user{align-self:flex-end;background:hsl(var(--pri));color:hsl(var(--pri-fg))}.msg.bot{align-self:flex-start;background:hsl(var(--muted))}
.chiprow{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid hsl(var(--border));background:hsl(var(--bg));border-radius:99px;padding:5px 10px;font-size:12px;color:hsl(var(--muted-fg))}
.composer{padding:12px;border-top:1px solid hsl(var(--border));display:flex;gap:8px}
.composer textarea{flex:1;resize:none;min-height:44px;border:1px solid hsl(var(--border));border-radius:10px;padding:10px;background:hsl(var(--bg))}
.drawer{position:fixed;inset:0;z-index:40;display:none}.drawer.open{display:block}
.scrim{position:absolute;inset:0;background:hsl(240 10% 4%/.4)}
.panel{position:absolute;left:0;top:0;bottom:0;width:280px;background:hsl(var(--bg));border-right:1px solid hsl(var(--border));padding:14px;display:flex;flex-direction:column;gap:4px}
.nav-h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:hsl(var(--muted-fg));padding:10px 8px 4px}
.nav-i{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;padding:8px;border-radius:8px}
.nav-i:hover,.nav-i.on{background:hsl(var(--accent))}
.modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:hsl(240 10% 4%/.4)}.modal.open{display:grid}
.sheet{width:min(420px,calc(100% - 32px));background:hsl(var(--bg));border:1px solid hsl(var(--border));border-radius:12px;padding:18px}
.sheet h2{margin:0 0 12px;font-size:16px}.field{margin-bottom:10px}.field label{display:block;font-size:12px;color:hsl(var(--muted-fg));margin-bottom:4px}
.field input{width:100%;padding:8px 10px;border-radius:8px;border:1px solid hsl(var(--border));background:hsl(var(--bg))}
</style></head>
<body>
<div id="app">
<header class="top">
<button class="icon" id="burger" type="button" aria-label="Open menu"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
<span class="title" id="boardTitle">Main</span><span class="sub" id="boardMeta">Your dashboard</span>
<div class="spacer"></div>
<button class="icon" id="theme" type="button"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2"/></svg></button>
<span class="who">Alice · analyst</span>
</header>
<div class="stage">
<main class="board" id="board"></main>
<aside class="chat" id="chat">
<div class="chat-head"><strong>Ask</strong>
<button class="icon" id="closeChat" type="button"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
<div class="thread" id="thread"></div>
<div class="composer"><textarea id="q" rows="1" placeholder="Ask about meetings, trends, MTD…"></textarea><button class="btn" id="send" type="button">Send</button></div>
</aside></div></div>
<button class="fab" id="fab" type="button" aria-label="Open chat"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>
<div class="drawer" id="drawer"><div class="scrim" id="scrim"></div>
<nav class="panel"><div class="nav-h">Dashboards</div><div id="boardList"></div>
<button class="nav-i" id="newBoard" type="button">+ New dashboard</button>
<div class="nav-h">Account</div>
<button class="nav-i" id="openSettings" type="button">Settings</button></nav></div>
<div class="modal" id="createModal"><div class="sheet"><h2>New dashboard</h2>
<div class="field"><label>Name</label><input id="newName" placeholder="e.g. Sales weekly"/></div>
<div class="row-actions"><button class="btn" id="createGo" type="button">Create</button><button class="btn-out" id="createCancel" type="button">Cancel</button></div></div></div>
<div class="modal" id="settingsModal"><div class="sheet"><h2>Settings</h2>
<p class="who">Connected data: Cortex · Role: analyst</p><p class="who">Default board: Main</p>
<div class="row-actions"><button class="btn-out" id="settingsClose" type="button">Done</button></div></div></div>
<script>
const dashboards=[{id:"main",name:"Main",widgets:[]},{id:"sales",name:"Sales",widgets:[]}];
let current="main";const cache=new Map();
const TREND=[28,30,29,33,31,35,34,36,38,37,39,40,41,38,42,40,43,41,39,44,42,45,43,41,46,44,42,47,45,42];
function spark(series){const w=520,h=140,p=8,min=Math.min(...series),max=Math.max(...series);const pts=series.map((v,i)=>{const x=p+(i/(series.length-1))*(w-2*p);const y=h-p-((v-min)/(max-min||1))*(h-2*p);return x.toFixed(1)+","+y.toFixed(1)}).join(" ");return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline fill="none" stroke="hsl(221 83% 53%)" stroke-width="2" points="${pts}"/></svg>`}
function widgetHtml(w){if(w.type==="kpi")return `<article class="card"><h3>${w.title} <span class="badge ${w.src}">${w.src}</span></h3><div class="kpi">${w.value}</div><div class="delta">${w.delta||""}</div><div class="row-actions"><button class="btn-out btn-sm" data-pin="${w.id}">Pin to ${dash().name}</button><button class="btn-out btn-sm" data-share="${w.id}">Share</button></div></article>`;return `<article class="card" style="margin-top:12px"><h3>${w.title} <span class="badge ${w.src}">${w.src}</span></h3>${spark(w.series)}<div class="row-actions"><button class="btn-out btn-sm" data-pin="${w.id}">Pin to ${dash().name}</button><button class="btn-out btn-sm" data-share="${w.id}">Share</button></div></article>`}
function dash(){return dashboards.find(d=>d.id===current)}
function renderBoard(live){const widgets=live||dash().widgets;const el=document.getElementById("board");document.getElementById("boardTitle").textContent=dash().name;document.getElementById("boardMeta").textContent=live?"Live from chat":"Your dashboard";if(!widgets.length){el.innerHTML=`<div class="empty"><h2 style="margin:0 0 6px;color:hsl(var(--fg));font-size:16px">Nothing pinned yet</h2>Open chat and ask for meetings yesterday, a 30-day trend, or month to date.</div>`;return}const kpis=widgets.filter(w=>w.type==="kpi");const charts=widgets.filter(w=>w.type!=="kpi");el.innerHTML=(kpis.length?`<div class="kpis">${kpis.map(widgetHtml).join("")}</div>`:"")+charts.map(widgetHtml).join("")}
function addMsg(role,html){const d=document.createElement("div");d.className="msg "+role;d.innerHTML=html;document.getElementById("thread").appendChild(d);d.scrollIntoView({behavior:"smooth",block:"end"})}
function parse(text){const t=text.toLowerCase(),out=[];if(t.includes("yesterday")||t.includes("all"))out.push("yesterday");if(t.includes("30")||t.includes("trend")||t.includes("all"))out.push("trend");if(t.includes("month")||t.includes("mtd")||t.includes("all"))out.push("mtd");return out.length?[...new Set(out)]:["yesterday"]}
function ask(text){addMsg("user",text.replace(/</g,""));const live=[];parse(text).forEach(k=>{const key=k+":analyst";const src=cache.has(key)?"cached":"fresh";cache.set(key,1);if(k==="yesterday")live.push({id:"y",type:"kpi",title:"Meetings yesterday",value:42,delta:"+8% vs prior day",src});if(k==="mtd")live.push({id:"m",type:"kpi",title:"Month to date",value:310,delta:"target 400",src});if(k==="trend")live.push({id:"t",type:"line",title:"Last 30 days",series:TREND,src})});window.__live=live;renderBoard(live);addMsg("bot",`Cortex returned ${live.length} widget${live.length>1?"s":""}. Pin any card to keep it on <strong>${dash().name}</strong>.`)}
function openChat(){document.body.classList.add("chat-open");document.getElementById("fab").classList.add("hidden");const th=document.getElementById("thread");if(!th.childElementCount){th.innerHTML=`<div class="msg bot">Ask about meetings. Try a chip or type your own question.</div><div class="chiprow"><button class="chip" data-q="How many meetings happened yesterday">Yesterday</button><button class="chip" data-q="Show the meeting trend for the last 30 days">30-day trend</button><button class="chip" data-q="all meetings yesterday trend 30 days month to date">All three</button></div>`}document.getElementById("q").focus()}
function closeChat(){document.body.classList.remove("chat-open");document.getElementById("fab").classList.remove("hidden");renderBoard()}
function renderNav(){document.getElementById("boardList").innerHTML=dashboards.map(d=>`<button class="nav-i ${d.id===current?"on":""}" data-board="${d.id}" type="button">${d.name}</button>`).join("")}
document.getElementById("burger").onclick=()=>{renderNav();document.getElementById("drawer").classList.add("open")};
document.getElementById("scrim").onclick=()=>document.getElementById("drawer").classList.remove("open");
document.getElementById("fab").onclick=openChat;
document.getElementById("closeChat").onclick=closeChat;
document.getElementById("theme").onclick=()=>document.documentElement.classList.toggle("dark");
document.getElementById("send").onclick=()=>{const q=document.getElementById("q");if(!q.value.trim())return;ask(q.value.trim());q.value=""};
document.getElementById("q").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();document.getElementById("send").click()}});
document.getElementById("thread").addEventListener("click",e=>{if(e.target.dataset.q)ask(e.target.dataset.q)});
document.getElementById("board").addEventListener("click",e=>{const id=e.target.dataset.pin;if(!id||!window.__live)return;const w=window.__live.find(x=>x.id===id);if(!w)return;const board=dash();if(!board.widgets.some(x=>x.id===w.id))board.widgets.push({...w});addMsg("bot",`Pinned to <strong>${board.name}</strong>.`)});
document.getElementById("boardList").addEventListener("click",e=>{const id=e.target.dataset.board;if(!id)return;current=id;document.getElementById("drawer").classList.remove("open");renderBoard()});
document.getElementById("newBoard").onclick=()=>{document.getElementById("drawer").classList.remove("open");document.getElementById("createModal").classList.add("open");document.getElementById("newName").focus()};
document.getElementById("createCancel").onclick=()=>document.getElementById("createModal").classList.remove("open");
document.getElementById("createGo").onclick=()=>{const name=document.getElementById("newName").value.trim()||"Untitled";const id="d"+Date.now();dashboards.push({id,name,widgets:[]});current=id;document.getElementById("createModal").classList.remove("open");renderBoard()};
document.getElementById("openSettings").onclick=()=>{document.getElementById("drawer").classList.remove("open");document.getElementById("settingsModal").classList.add("open")};
document.getElementById("settingsClose").onclick=()=>document.getElementById("settingsModal").classList.remove("open");
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;document.getElementById("createModal").classList.remove("open");document.getElementById("settingsModal").classList.remove("open");document.getElementById("drawer").classList.remove("open");if(document.body.classList.contains("chat-open"))closeChat()});
renderBoard();
</script></body></html>
